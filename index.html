<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starmap</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Interface -->
    <div id="interface">

        <div id="star-info">
            <button id="close-star-info">×</button>
            <h2 id="star-name"></h2>
            <p id="star-alias"></p>
            <p id="star-constellation"></p>
            <p id="star-magnitude"></p>
            <p id="star-fixcoordinates"></p>
            <p id="star-coordinates"></p>
        </div>

    </div>

    <!-- Zone dans laquelle la carte sera dessinée -->
    <canvas id="sky"></canvas>

    <!-- Programme principal -->
    <script type="module" src="js/main.js"></script>

</body>

</html>
